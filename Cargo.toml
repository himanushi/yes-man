[package]
name = "yes-man"
version = "0.1.0"
edition = "2021"
resolver = "2"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
esp-idf-svc = { version = "0.50", features = ["critical-section", "embassy-time-driver"] }
esp-idf-hal = "0.45"
log = "0.4"
anyhow = "1.0"

# Display
embedded-graphics = "0.8"
display-interface = "0.5"
display-interface-spi = "0.5"
mipidsi = "0.8"

[build-dependencies]
embuild = "0.33"
