[package]
name = "yes-man"
version = "0.1.0"
edition = "2021"
resolver = "2"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
log = "0.4"
anyhow = "1.0"

# Display (platform independent)
embedded-graphics = "0.8"

# ESP32 specific dependencies
[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-idf-svc = { version = "0.50", features = ["critical-section", "embassy-time-driver"] }
esp-idf-hal = "0.45"
display-interface = "0.5"
display-interface-spi = "0.5"
mipidsi = "0.8"

[build-dependencies]
embuild = { version = "0.33", optional = true }

[features]
default = ["esp-build"]
esp-build = ["embuild"]
